{% for item in site.data.settings.social %}

  {% assign first_char = item.link | slice: 0 %}

  {% if item.icon == 'inaturalist' %}

    <a href="{{ item.link }}"
       target="_blank"
       rel="noopener"
       aria-label="iNaturalist"
       class="inaturalist-link">

      <svg class="inaturalist-icon"
           viewBox="0 0 24 24"
           aria-hidden="true"
           focusable="false">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M8.2 15.8c1.2-4.8 4.2-7.5 8.7-8.7-1.2 4.5-3.9 7.5-8.7 8.7z"></path>
        <path d="M9.6 14.4l4.9-4.9"></path>
      </svg>

    </a>

  {% elsif first_char == '/' %}

    <a href="{{ site.baseurl }}{{ item.link }}">
      <i class="fa fa-{{ item.icon }}" aria-hidden="true"></i>
    </a>

  {% elsif item.icon == 'researchgate' or item.icon == 'google-scholar' %}

    <a href="{{ item.link }}"
       target="_blank"
       rel="noopener"
       aria-label="{{ item.icon }}">
      <i class="ai ai-{{ item.icon }}" aria-hidden="true"></i>
    </a>

  {% else %}

    <a href="{{ item.link }}"
       target="_blank"
       rel="noopener"
       aria-label="{{ item.icon }}">
      <i class="fa fa-{{ item.icon }}" aria-hidden="true"></i>
    </a>

  {% endif %}

{% endfor %}

<style>
  .inaturalist-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
  }

  .inaturalist-icon {
    width: 1em;
    height: 1em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
